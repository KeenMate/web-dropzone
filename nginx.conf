# Static server for the web-dropzone examples site.
#
# The site is 100% static (pre-built dist-examples/: HTML + compiled bundles),
# with no backend, so the vulnerability scanners that constantly probe the
# public host (leakix/l9scan et al. hitting /api/gql, info.php, /telescope,
# config.json, .git, .env, ...) have nothing to exploit — they only spam the
# logs. Drop that traffic silently with 444 (close the connection, no response,
# no log line).

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # 1. Known vulnerability scanners by User-Agent → close immediately.
    if ($http_user_agent ~* "(l9scan|leakix|nikto|sqlmap|nmap|masscan|zgrab|censys|nuclei|httpx|semrush|petalbot)") {
        return 444;
    }

    # 2. Exploit-probe file extensions this static site never serves.
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|env|ini|sh|bak|old|sql)$ {
        access_log off;
        return 444;
    }

    # 3. Exploit-probe paths (app frameworks, VCS/CI metadata, dotfiles).
    location ~* /(\.git|\.svn|\.hg|\.env|wp-admin|wp-login|wp-content|wp-includes|xmlrpc|telescope|actuator|vendor|META-INF|WEB-INF|phpmyadmin|pma|adminer|owa)(/|$) {
        access_log off;
        return 444;
    }

    # 4. Everything legitimate: serve the static file or a normal 404. The bare
    # host resolves to index.html via the `index` directive above.
    #
    # The examples are built by Vite into dist-examples/ with content-hashed
    # asset filenames, but the top-level HTML pages (index.html, examples-*.html)
    # keep stable names with no cache-busting across redeploys. Send `no-cache`
    # (always revalidate via ETag: a cheap 304 when unchanged, fresh bytes the
    # moment a new image is deployed) so visitors never get a stale build.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
